name: 'Run Benchmarks'
description: 'Run Aztec benchmarks, generate diff report, and upload results'

inputs:
  pr-number:
    description: 'Pull request number'
    required: true
  base-ref:
    description: 'Base branch ref for comparison'
    required: true
  bench-dir:
    description: 'Directory for benchmark files'
    required: false
    default: './benchmarks'

runs:
  using: 'composite'
  steps:
    - name: Download baseline artifact
      id: download-baseline
      uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
      with:
        workflow: update-baseline.yml
        branch: ${{ inputs.base-ref }}
        name: benchmark-baseline-${{ inputs.base-ref }}
        path: ${{ inputs.bench-dir }}
        if_no_artifact_found: warn
      continue-on-error: true

    - name: Handle missing baseline
      shell: bash
      run: |
        # Check if any baseline files exist
        baseline_count=$(ls -1 ${{ inputs.bench-dir }}/*_latest.benchmark.json 2>/dev/null | wc -l)
        if [ "$baseline_count" -eq 0 ]; then
          echo "⚠️ No baseline found for ${{ inputs.base-ref }}"
          echo "This is expected for first benchmark run or if baseline expired"
          echo "All benchmarks will be reported as new"
        else
          echo "✓ Baseline benchmarks loaded successfully"
          ls -lh ${{ inputs.bench-dir }}/*_latest.benchmark.json
        fi

    - name: Generate Markdown diff
      uses: defi-wonderland/aztec-benchmark/action@main
      with:
        base_suffix: '_latest'
        current_suffix: '_new'

    - name: Comment diff on PR
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ inputs.pr-number }}
        body-path: benchmark-comparison.md

    - name: Prepare benchmark files for upload
      shell: bash
      run: |
        # Remove old _latest files (from base branch fetch) before renaming
        rm -f ${{ inputs.bench-dir }}/*_latest.benchmark.json
        
        # Rename _new files to _latest (the canonical stored format)
        for file in ${{ inputs.bench-dir }}/*_new.benchmark.json; do
          if [ -f "$file" ]; then
            new_name="${file/_new.benchmark.json/_latest.benchmark.json}"
            echo "Renaming $file -> $new_name"
            mv "$file" "$new_name"
          fi
        done

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-pr-${{ inputs.pr-number }}
        path: ${{ inputs.bench-dir }}/*_latest.benchmark.json
        retention-days: 7
