name: Update Baseline Benchmarks

on:
  # Trigger when changes merge to dev or main
  push:
    branches:
      - dev
      - main

  # Monthly refresh to prevent 90-day expiration
  schedule:
    - cron: '0 0 1 * *' # First day of every month at midnight UTC

  # Manual trigger option
  workflow_dispatch:

concurrency:
  group: update-baseline-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BENCH_DIR: ./benchmarks

jobs:
  update-baseline:
    name: Update Baseline
    runs-on: ubuntu-latest-m
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Aztec environment
        uses: ./.github/actions/setup-aztec
        with:
          start-pxe: 'true'
          run-codegen: 'true'

      - name: Run benchmarks
        run: |
          echo "Running benchmarks with --suffix _latest"
          npx aztec-benchmark --suffix _latest

      - name: Inject system information
        run: |
          echo "Injecting system information into baseline benchmarks"
          node .github/scripts/inject-system-info.js ${{ env.BENCH_DIR }}

      - name: Verify baseline files
        run: |
          echo "Baseline files to upload:"
          ls -lh ${{ env.BENCH_DIR }}/*_latest.benchmark.json

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline-${{ github.ref_name }}
          path: ${{ env.BENCH_DIR }}/*_latest.benchmark.json
          retention-days: 90
          if-no-files-found: error
